<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>HIGH SCORE | Naše šipky</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f7f8fc;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:14px 14px 60px}h1{font-size:29px;margin:8px 0}h2{font-size:18px;margin:8px 0}.muted{color:#b6c2d7;font-size:13px}.panel{background:#1b283b;border:1px solid #34445b;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}button,select,input{font:inherit;border-radius:11px;border:1px solid #52647c;background:#263b55;color:white;padding:12px 10px;min-height:46px}button{cursor:pointer;font-weight:700}button:disabled{opacity:.35}button.active{background:#f1b95c;color:#101827}button.primary{background:#2e8e77;border-color:#46ad95}button.warn{background:#743e49}input{width:100%;min-width:0}select{width:100%}.scoreboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{border:2px solid var(--c);border-radius:13px;padding:12px;background:#122034}.player.on{box-shadow:0 0 0 2px #fff5}.score{font-size:38px;font-weight:850}.small{font-size:12px;color:#b6c2d7}.hidden{display:none!important}.wide{grid-column:span 2}.status{padding:11px;border-radius:10px;background:#30435b;margin-top:10px}#numbers button{font-size:18px}#log{max-height:135px;overflow:auto;font-size:13px;color:#cbd5e1}label{font-size:13px;color:#b6c2d7;display:block;margin:9px 0 4px}.pill{padding:6px 9px;border-radius:30px;background:#34445b;font-size:12px}@media(max-width:420px){.grid{gap:5px}.grid button{padding:9px 2px}.score{font-size:32px}main{padding:10px}}
</style></head><body><main><h1>🎯 HIGH SCORE</h1><div class="muted">NAŠE ŠIPKY · co nejvíc bodů · 3 šipky na tah</div>
<section class="panel" id="setup"><h2>Nová hra</h2><label>Počet hráčů</label><select id="count" onchange="drawNames()"><option value="2">2 hráči</option><option value="3">3 hráči</option><option value="4">4 hráči</option></select><div id="names"></div><label>Režim</label><select id="mode" onchange="drawGoal()"><option value="rounds">Na počet kol</option><option value="target">Na cílové skóre</option></select><div id="goal"></div><button class="primary" style="width:100%;margin-top:14px" onclick="start()">ZAČÍT HRU</button><button id="resume" class="hidden" style="width:100%;margin-top:8px" onclick="resumeGame()">Pokračovat v uložené hře</button></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><span id="progress" class="pill"></span><span id="turninfo" class="pill"></span></div><div id="board" class="scoreboard" style="margin-top:12px"></div><div id="status" class="status"></div></div>
<div class="panel" id="controls"><h2 id="heading">Zápis šipek</h2><div class="row" id="mult"><button id="s" class="active" onclick="setMult(1)">SINGLE</button><button id="d" onclick="setMult(2)">DOUBLE</button><button id="t" onclick="setMult(3)">TRIPLE</button></div><div class="grid" id="numbers"></div><div class="row" style="margin-top:9px"><button onclick="dart(0)">MIMO · 0</button><button onclick="dart(25)">BULL 25</button><button onclick="dart(50)">BULL 50</button></div><div class="status" id="current"></div><div class="row" style="margin-top:10px"><button onclick="skip()">Zbytek šipek = 0 / další hráč</button></div><hr style="border:0;border-top:1px solid #34445b;margin:16px 0"><label>Rychlý zápis celého tahu (0–180 bodů)</label><div class="row"><input id="quick" type="number" min="0" max="180" placeholder="Např. 85" style="flex:1"><button onclick="quickTurn()">ZAPSAT TAH</button></div><div class="muted" style="margin-top:7px">Rychlý zápis nahradí zbývající šipky v aktuálním tahu. Zadávej součet celého tahu pouze před první šipkou.</div></div>
<div class="panel"><div class="row"><button onclick="undo()">↶ ZPĚT</button><button onclick="resetConfirm()" class="warn">Nová hra</button></div><h2>Historie</h2><div id="log"></div></div></section>
</main><script>
'use strict';
const KEY='nase-sipky-high-score-v1', COLORS=['#d63c45','#2878d0','#e5a53a','#3ba987'];
let st=null, mult=1, history=[];
function el(id){return document.getElementById(id)}
function drawNames(){let n=+el('count').value, old=[...el('names').querySelectorAll('input')].map(x=>x.value);el('names').innerHTML=Array.from({length:n},(_,i)=>`<label>Hráč ${i+1}</label><input maxlength="24" id="p${i}" value="${esc(old[i]||(['SÁJA','VOKUREK','HRÁČ 3','HRÁČ 4'][i]))}">`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawGoal(){el('goal').innerHTML=el('mode').value==='rounds'?'<label>Počet kol</label><select id="value"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>':'<label>Cílové skóre</label><select id="value"><option>300</option><option selected>500</option><option>750</option><option>1000</option></select>'}
function save(){localStorage.setItem(KEY,JSON.stringify({st,history}))}
function start(){let names=Array.from({length:+el('count').value},(_,i)=>el('p'+i).value.trim()||'Hráč '+(i+1));st={names,scores:names.map(()=>0),mode:el('mode').value,goal:+el('value').value,turn:0,throws:[],round:1,log:[],done:false,winner:null,phase:'normal',finalRound:null,tiePlayers:[],tieTurn:0,tieRound:0};history=[];save();render()}
function resumeGame(){try{let x=JSON.parse(localStorage.getItem(KEY));st=x.st;history=x.history||[];render()}catch(e){alert('Uloženou hru se nepodařilo načíst.')}}
function snapshot(){history.push(JSON.stringify(st));if(history.length>200)history.shift()}
function undo(){if(!history.length)return;st=JSON.parse(history.pop());save();render()}
function setMult(v){mult=v;for(let [id,x] of [['s',1],['d',2],['t',3]])el(id).classList.toggle('active',v===x)}
function dart(n){if(!st||st.done)return;if(st.throws.length>=3)return;let pts=n===25||n===50||n===0?n:n*mult;record(pts,(n===0?'MIMO':n===25?'BULL 25':n===50?'BULL 50':('SDT'[mult-1]+n)));setMult(1)}
function record(pts,label){snapshot();st.throws.push({pts,label});if(st.throws.length===3)finishTurn();save();render()}
function skip(){if(!st||st.done)return;snapshot();while(st.throws.length<3)st.throws.push({pts:0,label:'MIMO'});finishTurn();save();render()}
function quickTurn(){if(!st||st.done)return;if(st.throws.length){alert('Rychlý zápis použij před první šipkou. Pro opravu stiskni ZPĚT.');return}let v=Number(el('quick').value);if(el('quick').value.trim()===''||!Number.isInteger(v)||v<0||v>180){alert('Zadej celé číslo od 0 do 180.');return}snapshot();st.throws=[{pts:v,label:'TAH '+v},{pts:0,label:''},{pts:0,label:''}];finishTurn();el('quick').value='';save();render()}
function finishTurn(){let i=st.phase==='tie'?st.tiePlayers[st.tieTurn]:st.turn, sum=st.throws.reduce((a,b)=>a+b.pts,0);st.scores[i]+=sum;st.log.unshift(`${st.names[i]}: +${sum} (${st.throws.map(x=>x.label).filter(Boolean).join(', ')})`);st.throws=[];
if(st.phase==='tie'){st.tieTurn++;if(st.tieTurn>=st.tiePlayers.length){st.tieTurn=0;st.tieRound++;let max=Math.max(...st.tiePlayers.map(j=>st.scores[j]));let leaders=st.tiePlayers.filter(j=>st.scores[j]===max);if(leaders.length===1){st.done=true;st.winner=leaders[0]}else st.tiePlayers=leaders}return}
st.turn++;if(st.turn>=st.names.length){st.turn=0;st.round++}
if(st.mode==='rounds'){if(st.round>st.goal)resolveEnd();return}
if(st.finalRound!==null){if(st.round>st.finalRound)resolveEnd();return}
if(st.scores.some(x=>x>=st.goal))st.finalRound=st.round+(st.turn===0?0:1)-1;
if(st.finalRound!==null&&st.round>st.finalRound)resolveEnd();
}
function resolveEnd(){let max=Math.max(...st.scores),leaders=st.scores.map((v,i)=>v===max?i:-1).filter(i=>i>=0);if(leaders.length===1){st.done=true;st.winner=leaders[0]}else{st.phase='tie';st.tiePlayers=leaders;st.tieTurn=0;st.tieRound=1;st.log.unshift('REMÍZA – dodatečné tříšipkové kolo jen pro vedoucí hráče')}}
function render(){el('setup').classList.toggle('hidden',!!st);el('game').classList.toggle('hidden',!st);if(!st)return;let i=st.phase==='tie'?st.tiePlayers[st.tieTurn]:st.turn;
el('progress').textContent=st.done?'KONEC HRY':st.phase==='tie'?`ROZSTŘEL · kolo ${st.tieRound}`:st.mode==='rounds'?`KOLO ${Math.min(st.round,st.goal)} / ${st.goal}`:`CÍL ${st.goal} BODŮ`;
el('turninfo').textContent=st.done?'Výsledek':`Na řadě: ${st.names[i]}`;
el('board').innerHTML=st.names.map((name,j)=>`<div class="player ${j===i&&!st.done?'on':''}" style="--c:${COLORS[j]}"><b style="color:${COLORS[j]}">${esc(name)}</b><div class="score">${st.scores[j]}</div><div class="small">${st.mode==='target'?'Do cíle: '+Math.max(0,st.goal-st.scores[j]):'bodů'}</div></div>`).join('');
let leader=Math.max(...st.scores),gap=leader-st.scores[i];
el('status').innerHTML=st.done?`🏆 Vítěz: <b style="color:${COLORS[st.winner]}">${esc(st.names[st.winner])}</b> (${st.scores[st.winner]} bodů)`:st.phase==='tie'?'🤝 Remíza na prvním místě. Hrají pouze hráči s nejvyšším skóre, každý další celé 3 šipky.':`${esc(st.names[i])}: ${gap?'ztrácí '+gap+' bodů na vedení':'je ve vedení nebo na děleném prvním místě'}.${st.finalRound!==null?' Probíhá poslední dorovnávací kolo.':''}`;
el('controls').classList.toggle('hidden',st.done);
el('heading').textContent=`${st.names[i]} · šipka ${st.throws.length+1} ze 3`;
el('current').textContent=`Tento tah: ${st.throws.reduce((a,b)=>a+b.pts,0)} bodů · ${st.throws.map(x=>x.label).filter(Boolean).join(' + ')||'zatím nic'}`;
el('numbers').innerHTML=Array.from({length:20},(_,j)=>`<button onclick="dart(${j+1})">${j+1}</button>`).join('');
el('log').innerHTML=st.log.slice(0,35).map(x=>`<div style="padding:6px 0;border-bottom:1px solid #34445b">${esc(x)}</div>`).join('')||'Zatím žádné hody';
}
function resetConfirm(){if(confirm('Opravdu začít novou hru? Rozehraná hra se smaže.')){localStorage.removeItem(KEY);st=null;history=[];drawNames();drawGoal();el('setup').classList.remove('hidden');el('game').classList.add('hidden');el('resume').classList.add('hidden')}}
drawNames();drawGoal();if(localStorage.getItem(KEY))el('resume').classList.remove('hidden');
</script></body></html>
